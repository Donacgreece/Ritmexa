<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dbf6ff" />
    <meta name="description" content="Ritmexa turns photos and clips into beat synced vertical edits locally in your browser." />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ritmexa" />
    <meta property="og:title" content="Ritmexa • Your moments, on beat" />
    <meta property="og:description" content="Beat synced edits from photos, clips and music. Local and private." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon-v027.png" />
    <link rel="apple-touch-startup-image" href="./launch/iphone-430x932-v030.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="./launch/iphone-393x852-v030.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="./launch/iphone-390x844-v030.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="./launch/iphone-414x896-3x-v030.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="./launch/iphone-375x812-v030.png" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3)" />
    <link rel="apple-touch-startup-image" href="./launch/iphone-414x896-2x-v030.png" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2)" />
    <link rel="apple-touch-startup-image" href="./launch/iphone-375x667-v030.png" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" />
    <title>Ritmexa • Your moments, on beat</title>
    <script>
      if (!window.matchMedia('(display-mode: standalone)').matches && !navigator.standalone) {
        document.documentElement.classList.add('browser-mode')
      }
    </script>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#dbf6ff}
      #app-splash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#dbf6ff;transition:opacity .34s ease,visibility .34s ease}
      .browser-mode #app-splash{display:none}
      .app-ready #app-splash{opacity:0;visibility:hidden;pointer-events:none}
      .launch-lockup{display:flex;flex-direction:column;align-items:center;gap:17px;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f1f1f}
      .launch-mark-img{width:118px;height:118px;object-fit:contain}
      .launch-lockup strong{font-size:31px;letter-spacing:-.05em}
      .launch-lockup small{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#5d6c72;font-weight:800}
    </style>
  </head>
  <body>
    <div id="app-splash" aria-hidden="true">
      <div class="launch-lockup">
        <img class="launch-mark-img" src="./brand-mark-v030.png" alt="" />
        <strong>Ritmexa</strong>
        <small>Your moments, on beat</small>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
